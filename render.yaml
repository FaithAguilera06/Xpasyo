services:
  - type: web
    name: xpasyo
    env: php
    buildCommand: composer install --no-dev --optimize-autoloader
    startCommand: php -S 0.0.0.0:10000 -t .
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
    # Update this to your main PHP file if different
    httpPort: 10000
    healthCheckPath: /INDEX.php
